<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7f8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a74ff"/>
      <stop offset="1" stop-color="#2b2fcf"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#e4dac4"/>
    </linearGradient>
    <radialGradient id="disk" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset="0.55" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="44" fill="#14161d"/>
  <circle cx="128" cy="128" r="112" fill="url(#glow)"/>
  <ellipse cx="128" cy="224" rx="70" ry="9" fill="#000" opacity="0.45"/>

  <!-- top: Octagrams -->
  <g transform="matrix(0.76 0.44 -0.76 0.44 128 40)">
    <rect width="100" height="100" fill="url(#top)"/>
    <g fill="#e8ecff" opacity="0.9">
      <rect x="28" y="28" width="44" height="44"/>
      <rect x="28" y="28" width="44" height="44" transform="rotate(45 50 50)"/>
    </g>
    <g fill="#5a74ff">
      <rect x="38" y="38" width="24" height="24"/>
      <rect x="38" y="38" width="24" height="24" transform="rotate(45 50 50)"/>
    </g>
    <circle cx="50" cy="50" r="5" fill="#fff"/>
  </g>

  <!-- left: latte art -->
  <g transform="matrix(0.76 0.44 0 0.88 52 84)">
    <rect width="100" height="100" fill="url(#cream)"/>
    <circle cx="50" cy="56" r="30" fill="#d9cfb8"/>
    <circle cx="50" cy="56" r="24" fill="#5f8a3c"/>
    <circle cx="50" cy="56" r="4" fill="#fbf6ea"/>
    <rect x="72" y="14" width="18" height="6" rx="3" fill="#5f8a3c"/>
    <rect x="72" y="24" width="18" height="6" rx="3" fill="#8a8170"/>
  </g>

  <!-- right: black hole -->
  <g transform="matrix(0.76 -0.44 0 0.88 128 128)">
    <rect width="100" height="100" fill="#070912"/>
    <circle cx="22" cy="18" r="1.2" fill="#fff"/>
    <circle cx="80" cy="30" r="1" fill="#fff"/>
    <circle cx="66" cy="84" r="1.2" fill="#fff"/>
    <circle cx="14" cy="76" r="0.9" fill="#fff"/>
    <ellipse cx="50" cy="54" rx="44" ry="15" fill="url(#disk)"/>
    <circle cx="50" cy="50" r="15" fill="#000"/>
    <circle cx="50" cy="50" r="15" fill="none" stroke="#ffd58a" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- edges -->
  <g fill="none" stroke="#0b0c12" stroke-width="2.5" stroke-linejoin="round">
    <path d="M128 40 L204 84 L204 172 L128 216 L52 172 L52 84 Z"/>
    <path d="M52 84 L128 128 L204 84 M128 128 L128 216"/>
  </g>
</svg>
